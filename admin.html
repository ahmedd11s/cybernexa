<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNEXA | لوحة تحكم المدير</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #070b1a; --accent: #8ab4ff; --accent-rgb: 138, 180, 255; }
        body { background-color: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 40px; background: #0f172a; border-bottom: 1px solid #334155; }
        .logo { font-size: 24px; font-weight: bold; color: #fff; text-decoration: none; }
        .logo span { color: var(--accent); }
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #0f172a; border: 1px solid #334155; padding: 25px; border-radius: 12px; text-align: center; }
        .stat-card h3 { color: #94a3b8; font-size: 16px; margin: 0 0 10px 0; }
        .stat-card .value { font-size: 40px; font-weight: bold; color: var(--accent); }
        .table-card { background: #0f172a; border: 1px solid #334155; padding: 25px; border-radius: 12px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; min-width: 640px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #1e293b; }
        th { color: #94a3b8; font-weight: 600; }
        .btn-delete { background: #e55353; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-family: inherit; transition: .3s; }
        .btn-delete:hover { background: #c94444; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-admin { background: rgba(var(--accent-rgb), 0.18); color: var(--accent); }
        .badge-user { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }
        .table-card + .table-card { margin-top: 30px; }
        .admin-ticket { border-bottom: 1px solid #334155; padding: 15px 0; }
        .admin-ticket-top { display: flex; justify-content: space-between; gap: 12px; }
        .admin-ticket-msg { color: #94a3b8; margin: 5px 0; }
        .ticket-open { color: #f5c26b; }
        .ticket-closed { color: var(--accent); }
        .reply-row { display: flex; gap: 10px; margin-top: 10px; }
        .reply-row input { flex: 1; min-width: 0; padding: 8px; background: var(--bg); border: 1px solid #334155; color: #fff; border-radius: 6px; font-family: inherit; }
        .btn-action { padding: 8px 18px; background: var(--accent); color: var(--bg); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit; }
        .btn-action:disabled, .btn-delete:disabled { opacity: .6; cursor: not-allowed; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        @media (max-width: 800px) {
            .navbar { padding: 14px 16px; }
            .container { padding: 12px; margin-top: 20px; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">CYBER<span>NEXA</span> ADMIN</a>
        <a href="dashboard.html" style="color: var(--accent); text-decoration: none;">← العودة للمنصة</a>
    </nav>

    <div class="container">
        <h1 style="margin-bottom: 30px;">لوحة تحكم المدير 👑</h1>

        <!-- الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي المستخدمين</h3>
                <div class="value" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>إجمالي الفحوصات</h3>
                <div class="value" id="totalScans">-</div>
            </div>
            <div class="stat-card">
                <h3>التهديدات المكتشفة</h3>
                <div class="value" style="color: #ff8a8a;" id="threatsDetected">-</div>
            </div>
        </div>

        <!-- جدول المستخدمين -->
        <div class="table-card">
            <h3 style="margin-top: 0;">إدارة المستخدمين</h3>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>البريد الإلكتروني</th>
                            <th>الصلاحية</th>
                            <th>تاريخ التسجيل</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="5" style="text-align: center;">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- تذاكر الدعم -->
        <div class="table-card">
            <h3 style="margin-top: 0;">تذاكر الدعم الفني</h3>
            <div id="adminTicketsList" aria-live="polite">
                <p style="text-align: center; color: #94a3b8;">جاري التحميل...</p>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
