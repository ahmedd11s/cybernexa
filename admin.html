<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNEXA | لوحة تحكم المدير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #070b16; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #0f172a; border-bottom: 1px solid #334155; }
        .logo { font-size: 24px; font-weight: bold; color: #fff; text-decoration: none; }
        .logo span { color: #00ffaa; }
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #0f172a; border: 1px solid #334155; padding: 25px; border-radius: 12px; text-align: center; }
        .stat-card h3 { color: #94a3b8; font-size: 16px; margin: 0 0 10px 0; }
        .stat-card .value { font-size: 40px; font-weight: bold; color: #00ffaa; }
        .table-card { background: #0f172a; border: 1px solid #334155; padding: 25px; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #1e293b; }
        th { color: #94a3b8; font-weight: 600; }
        .btn-delete { background: #ff4444; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-family: inherit; }
        .btn-delete:hover { background: #cc0000; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-admin { background: rgba(0, 255, 170, 0.2); color: #00ffaa; }
        .badge-user { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">CYBER<span>NEXA</span> ADMIN</a>
        <a href="dashboard.html" style="color: #00ffaa; text-decoration: none;">← العودة للمنصة</a>
    </nav>

    <div class="container">
        <h1 style="margin-bottom: 30px;">لوحة تحكم المدير 👑</h1>
        
        <!-- الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي المستخدمين</h3>
                <div class="value" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>إجمالي الفحوصات</h3>
                <div class="value" id="totalScans">-</div>
            </div>
            <div class="stat-card">
                <h3>التهديدات المكتشفة</h3>
                <div class="value" style="color: #ff4444;" id="threatsDetected">-</div>
            </div>
        </div>

        <!-- جدول المستخدمين -->
        <div class="table-card">
            <h3 style="margin-top: 0;">إدارة المستخدمين</h3>
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>البريد الإلكتروني</th>
                        <th>الصلاحية</th>
                        <th>تاريخ التسجيل</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="5" style="text-align: center;">جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>ا
