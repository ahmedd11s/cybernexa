<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNEXA | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-body { background-color: #070b16; color: #fff; font-family: 'Cairo', sans-serif; }
        .navbar { display: flex; justify-content: space-between; padding: 20px 40px; background: rgba(15, 23, 42, 0.8); border-bottom: 1px solid #334155; }
        .logo { font-size: 24px; font-weight: bold; color: #fff; text-decoration: none; }
        .logo span { color: #00ffaa; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        .card { background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 12px; padding: 30px; margin-bottom: 20px; }
        .card h2 { color: #00ffaa; margin-bottom: 15px; }
        .btn-logout { background: #ff4444; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; }
        .btn-logout:hover { background: #cc0000; }
        .user-info p { margin: 10px 0; font-size: 16px; color: #cbd5e1; }
        .user-info strong { color: #fff; }
    </style>
</head>
<body class="dashboard-body">
    
    <nav class="navbar">
        <a href="index.html" class="logo">CYBER<span>NEXA</span></a>
        <button id="logoutBtn" class="btn-logout">تسجيل الخروج</button>
    </nav>

    <div class="container">
        <div class="card">
            <h2>مرحباً بك في منصة الحماية 🛡️</h2>
            <div class="user-info">
                <p>الاسم: <strong id="userName">جاري التحميل...</strong></p>
                <p>البريد الإلكتروني: <strong id="userEmail">جاري التحميل...</strong></p>
                <p>نوع الحساب: <strong id="userRole">جاري التحميل...</strong></p>
            </div>
        </div>

        <div class="card">
            <h2>الخدمات المتاحة</h2>
            <p style="color: #94a3b8;">هنا ستظهر أدوات الفحص والمراقبة الخاصة بك (قيد التطوير).</p>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
