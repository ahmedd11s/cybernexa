<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNEXA | إنشاء حساب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-box">
            <h2>انضم إلى <span>CYBERNEXA</span></h2>
            <p>أنشئ حسابك لحماية عالمك الرقمي</p>
            
            <div id="error-message" class="alert error" style="display: none;"></div>
            <div id="success-message" class="alert success" style="display: none;"></div>

            <form id="registerForm">
                <div class="input-group">
                    <label>الاسم بالكامل</label>
                    <input type="text" id="name" required placeholder="أدخل اسمك">
                </div>
                <div class="input-group">
                    <label>البريد الإلكتروني (أو رقم الهاتف)</label>
                    <input type="text" id="email" placeholder="example@mail.com أو 010...">
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required placeholder="8 أحرف على الأقل">
                </div>
                
                <button type="submit" class="btn-primary">إنشاء الحساب</button>
            </form>

            <div class="divider">أو</div>
            
            <button type="button" class="btn-google" onclick="alert('سيتم تفعيل جوجل بعد ربط مفاتيح الـ API')">
                <img src="https://img.icons8.com/color/24/000000/google-logo.png" alt="Google">
                التسجيل باستخدام Google
            </button>

            <p class="switch-auth">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
