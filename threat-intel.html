<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNEXA | استخبارات التهديدات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .body-dark { background-color: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        .header-intel { padding: 40px 20px; text-align: center; background: linear-gradient(180deg, rgba(var(--accent-rgb),0.12) 0%, transparent 100%); border-bottom: 1px solid #334155; }
        .header-intel h1 { color: var(--accent); margin-bottom: 10px; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .intel-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; border-right: 4px solid #ff6b6b; }
        .intel-card.severity-high { border-right-color: #ff6b6b; }
        .intel-card.severity-med { border-right-color: #f5c26b; }
        .intel-card.severity-low { border-right-color: var(--accent); }
        .intel-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 15px; }
        .intel-header h3 { color: #fff; font-size: 18px; margin: 0; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .badge-high { background: rgba(255,107,107,0.18); color: #ff8a8a; }
        .badge-med { background: rgba(245,194,107,0.18); color: #f5c26b; }
        .badge-low { background: rgba(var(--accent-rgb),0.18); color: var(--accent); }
        .intel-desc { color: #94a3b8; line-height: 1.6; }
        .back-btn { display: inline-block; margin-top: 20px; color: var(--accent); text-decoration: none; }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
</head>
<body class="body-dark">
    <div class="header-intel">
        <h1>🌐 استخبارات التهديدات العالمية</h1>
        <p style="color: #94a3b8;">أحدث الثغرات والاختراقات التي تم رصدها مؤخراً</p>
        <a href="dashboard.html" class="back-btn">← العودة للوحة التحكم</a>
    </div>

    <div class="container" id="intelFeed" aria-live="polite">
        <!-- سيتم تحميل الأخبار هنا عبر الجافاسكريبت -->
    </div>

    <!-- الصفحة الأصلية ما كانش فيها سكريبت، فالقائمة كانت بتفضل فاضية -->
    <script src="js/threat-intel.js"></script>
</body>
</html>
