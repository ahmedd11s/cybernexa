<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNEXA | استخبارات التهديدات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .body-dark { background-color: #070b16; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        .header-intel { padding: 40px; text-align: center; background: linear-gradient(180deg, rgba(0,255,170,0.1) 0%, transparent 100%); border-bottom: 1px solid #334155; }
        .header-intel h1 { color: #00ffaa; margin-bottom: 10px; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .intel-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; border-right: 4px solid #ff4444; }
        .intel-card.severity-high { border-right-color: #ff4444; }
        .intel-card.severity-med { border-right-color: #ffaa00; }
        .intel-card.severity-low { border-right-color: #00ffaa; }
        .intel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .intel-header h3 { color: #fff; font-size: 18px; margin: 0; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-high { background: rgba(255,68,68,0.2); color: #ff4444; }
        .badge-med { background: rgba(255,170,0,0.2); color: #ffaa00; }
        .badge-low { background: rgba(0,255,170,0.2); color: #00ffaa; }
        .intel-desc { color: #94a3b8; line-height: 1.6; }
        .back-btn { display: inline-block; margin-top: 20px; color: #00ffaa; text-decoration: none; }
    </style>
</head>
<body class="body-dark">
    <div class="header-intel">
        <h1>🌐 استخبارات التهديدات العالمية</h1>
        <p style="color: #94a3b8;">أحدث الثغرات والاختراقات التي تم رصدها مؤخراً</p>
        <a href="dashboard.html" class="back-btn">← العودة للوحة التحكم</a>
    </div>

    <div class="container" id="intelFeed">
        <!-- سيتم تحميل الأخبار هنا عبر الجافاسكريبت -->
    </div>
</body>
</html>
