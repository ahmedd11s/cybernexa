<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNEXA | مركز العمليات الأمنية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .soc-body { background-color: #030712; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #0f172a; min-height: 100vh; padding: 20px; border-left: 1px solid #1e293b; }
        .sidebar h2 { color: #00ffaa; text-align: center; margin-bottom: 30px; }
        .sidebar a { display: block; color: #94a3b8; text-decoration: none; padding: 12px; margin-bottom: 10px; border-radius: 8px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: rgba(0,255,170,0.1); color: #00ffaa; }
        .main-content { flex: 1; padding: 30px; }
        .soc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-box { background: #0f172a; border: 1px solid #1e293b; padding: 20px; border-radius: 12px; }
        .stat-box h3 { color: #94a3b8; font-size: 14px; margin: 0 0 10px 0; }
        .stat-box .value { font-size: 32px; font-weight: bold; color: #fff; }
        .log-container { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; font-family: monospace; height: 400px; overflow-y: auto; }
        .log-entry { padding: 10px; border-bottom: 1px solid #1e293b; font-size: 14px; }
        .log-danger { color: #ff4444; }
        .log-warning { color: #ffaa00; }
        .log-success { color: #00ffaa; }
    </style>
</head>
<body class="soc-body">
    <div class="sidebar">
        <h2>CYBERNEXA SOC</h2>
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="soc.html" class="active">مركز العمليات</a>
        <a href="threat-intel.html">استخبارات التهديدات</a>
        <a href="#" style="color: #ff4444; margin-top: 50px;">تسجيل الخروج</a>
    </div>

    <div class="main-content">
        <div class="soc-header">
            <h1>مركز العمليات الأمنية (SOC)</h1>
            <span style="color: #00ffaa; display: flex; align-items: center; gap: 5px;">
                <span style="width: 10px; height: 10px; background: #00ffaa; border-radius: 50%; display: inline-block;"></span> مباشر
            </span>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <h3>الهجمات التي تم صدها</h3>
                <div class="value" style="color: #00ffaa;">14,203</div>
            </div>
            <div class="stat-box">
                <h3>تهديدات نشطة حالياً</h3>
                <div class="value" style="color: #ff4444;">3</div>
            </div>
            <div class="stat-box">
                <h3>الأجهزة المتصلة</h3>
                <div class="value">842</div>
            </div>
        </div>

        <h3 style="margin-bottom: 15px;">سجل الأحداث المباشر (Live Logs)</h3>
        <div class="log-container" id="logContainer">
            <!-- سيتم إضافة السجلات هنا -->
        </div>
    </div>
    
    <script src="js/soc.js"></script>
</body>
</html>
