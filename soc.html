<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNEXA | مركز العمليات الأمنية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .soc-body { background-color: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; display: flex; }
        .sidebar { width: 250px; flex-shrink: 0; background: #0f172a; min-height: 100vh; padding: 20px; border-left: 1px solid #1e293b; }
        .sidebar h2 { color: var(--accent); text-align: center; margin-bottom: 30px; }
        .sidebar a { display: block; color: #94a3b8; text-decoration: none; padding: 12px; margin-bottom: 10px; border-radius: 8px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: rgba(var(--accent-rgb),0.12); color: var(--accent); }
        .sidebar a.logout { color: #ff8a8a; margin-top: 50px; }
        .sidebar a.logout:hover { background: rgba(255,107,107,0.12); color: #ff8a8a; }
        .main-content { flex: 1; min-width: 0; padding: 30px; }
        .soc-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-box { background: #0f172a; border: 1px solid #1e293b; padding: 20px; border-radius: 12px; }
        .stat-box h3 { color: #94a3b8; font-size: 14px; margin: 0 0 10px 0; }
        .stat-box .value { font-size: 32px; font-weight: bold; color: #fff; }
        .log-container { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; font-family: monospace; height: 400px; overflow-y: auto; }
        .log-entry { padding: 10px; border-bottom: 1px solid #1e293b; font-size: 14px; }
        .log-danger { color: #ff8a8a; }
        .log-warning { color: #f5c26b; }
        .log-success { color: var(--accent); }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        @media (max-width: 800px) {
            .soc-body { flex-direction: column; }
            .sidebar { width: 100%; min-height: 0; border-left: none; border-bottom: 1px solid #1e293b; padding: 14px; }
            .sidebar h2 { margin-bottom: 14px; }
            .sidebar a.logout { margin-top: 10px; }
            .main-content { padding: 18px; }
            .stats-grid { grid-template-columns: 1fr; }
            .soc-header h1 { font-size: 22px; }
        }
    </style>
</head>
<body class="soc-body">
    <div class="sidebar">
        <h2>CYBERNEXA SOC</h2>
        <a href="dashboard.html">لوحة التحكم</a>
        <a href="soc.html" class="active" aria-current="page">مركز العمليات</a>
        <a href="threat-intel.html">استخبارات التهديدات</a>
        <a href="login.html" id="socLogout" class="logout">تسجيل الخروج</a>
    </div>

    <div class="main-content">
        <div class="soc-header">
            <h1>مركز العمليات الأمنية (SOC)</h1>
            <span style="color: var(--accent); display: flex; align-items: center; gap: 5px;">
                <span style="width: 10px; height: 10px; background: var(--accent); border-radius: 50%; display: inline-block;"></span> مباشر
            </span>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <h3>الهجمات التي تم صدها</h3>
                <div class="value" id="statBlocked" style="color: var(--accent);">14,203</div>
            </div>
            <div class="stat-box">
                <h3>تهديدات نشطة حالياً</h3>
                <div class="value" id="statThreats" style="color: #ff8a8a;">3</div>
            </div>
            <div class="stat-box">
                <h3>الأجهزة المتصلة</h3>
                <div class="value" id="statDevices">842</div>
            </div>
        </div>

        <h3 style="margin-bottom: 15px;">سجل الأحداث المباشر (Live Logs)</h3>
        <div class="log-container" id="logContainer" role="log" aria-live="polite">
            <!-- سيتم إضافة السجلات هنا -->
        </div>
    </div>

    <script src="js/soc.js"></script>
    <script>
        // الخروج كان رابط "#" ما بيعمل حاجة. دلوقتي بيمسح الجلسة من السيرفر ثم يحوّل لصفحة الدخول
        document.getElementById('socLogout').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await fetch('https://s7e7sfnablec-production-12fbya08.us-central1.suga.run/api/auth/logout', { method: 'POST', credentials: 'include' });
            } catch (_) { /* نكمل على أي حال */ }
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
